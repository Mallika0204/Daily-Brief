kind = "web"
previewPath = "/"
title = "Daily Brief"
description = "Live global and Indian news discovery with reliable source links, topic search, video news and evidence-aware discussion prompts."
version = "1.0.0"
id = "artifacts/daily-brief"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20216

[services.development]
run = "pnpm --filter @workspace/daily-brief run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daily-brief", "run", "build" ]
serve = "static"
publicDir = "artifacts/daily-brief/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20216"
BASE_PATH = "/"
